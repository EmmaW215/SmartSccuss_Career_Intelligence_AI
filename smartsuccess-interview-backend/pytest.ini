[pytest]
# Phase 2 Agent Tools test configuration
#
# Default run excludes @pytest.mark.llm (real-LLM, costs ~$0.05/run):
#   pytest                      -> all offline tests (mocked LLM)
# Manual real-LLM run (requires OPENAI_API_KEY):
#   pytest -m llm tests/test_llm_integration.py
addopts = -m "not llm"
markers =
    llm: tests that call a real LLM API (manual run only, costs money)
asyncio_mode = auto
